    </marker>
    <style>
      .lnk { cursor: pointer; }
      .lnk:hover, .lnk:focus-visible { text-decoration: underline; }
      .head { cursor: pointer; }
      .head:focus-visible { outline: none; }
      .card, .flow { transition: stroke 120ms ease; }
      .stageL:hover .card, .stageL:focus-within .card { stroke: #60a5fa; }
      .stageR:hover .card, .stageR:focus-within .card { stroke: #fb923c; }
      .stageS:hover .card, .stageS:focus-within .card { stroke: #94a3b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      /* Light values are presentation attributes on each element;
         this block only overrides them when the viewer prefers dark. */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0b1220; }
        .logo { fill: #f1f5f9; }
        .logoLine { stroke: #f1f5f9; }
        .title { fill: #f1f5f9; }
        .sub { fill: #94a3b8; }
        .group { fill: #120f0c; stroke: #9a3412; }
        .groupT { fill: #fdba74; }
        .card { fill: #111b2e; stroke: #22314d; }
        .hdrL { fill: #142647; }
        .hdrR { fill: #33200f; }
        .hdrS { fill: #1a2436; }
        .tL, .cmdL { fill: #93c5fd; }
        .tR, .cmdR { fill: #fdba74; }
        .tS, .cmdS { fill: #e2e8f0; }
        .ink { fill: #cbd5e1; }
        .muted { fill: #8b9ab0; }
        .annot { fill: #94a3b8; }
        .flow { stroke: #64748b; }
        .arrowhead { fill: #64748b; }
      }
    </style>
  </defs>

