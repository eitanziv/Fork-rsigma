version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      patch-updates:
        update-types:
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    groups:
      patch-updates:
        update-types:
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-updates:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Track digest updates for the MSRV-pinned builder image. Rust version
  # changes are deliberate compatibility changes, not dependency updates.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # Base images, the pinned pySigma release, and the Fibratus module used by
  # the backend engine tests.
  - package-ecosystem: docker
    directories:
      - "/crates/rsigma-convert/tests/engines/lynxdb"
      - "/crates/rsigma-convert/tests/engines/pysigma"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: "/crates/rsigma-convert/tests/engines/pysigma"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: "/crates/rsigma-convert/tests/engines/fibratus"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Track the VS Code extension's npm dependencies (TypeScript types,
  # @vscode/vsce, eslint, etc.).
  - package-ecosystem: npm
    directory: "/editors/vscode"
    schedule:
      interval: weekly
    groups:
      npm-updates:
        update-types:
          - "patch"
          - "minor"
    cooldown:
      default-days: 7
