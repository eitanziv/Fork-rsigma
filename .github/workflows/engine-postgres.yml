name: Engine (PostgreSQL)

# Runs the PostgreSQL backend's SQL in a real PostgreSQL server. Triggered only
# by changes to that backend, its engine tests, the shared engine cases, or the
# shared conversion core.
on:
  push:
    branches: [main]
    paths: &paths
      - "crates/rsigma-convert/src/*.rs"
      - "crates/rsigma-convert/src/backends/postgres/**"
      - "crates/rsigma-convert/tests/engines/mod.rs"
      - "crates/rsigma-convert/tests/engines/cases/**"
      - "crates/rsigma-convert/tests/engine_postgres.rs"
      - "crates/rsigma-convert/tests/postgres_integration.rs"
      - ".github/workflows/engine-postgres.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: engine-postgres-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  postgres:
    name: PostgreSQL engine tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # read repo for checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the cases in PostgreSQL
        run: cargo test -p rsigma-convert --locked --test engine_postgres --test postgres_integration -- --ignored
