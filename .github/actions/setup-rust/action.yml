name: Set up pinned Rust
description: Install the Rust toolchain pinned in rust-toolchain.toml

inputs:
  components:
    description: Comma-separated rustup components to install
    required: false
    default: ""
  targets:
    description: Comma-separated rustup targets to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail

        toolchain="$(
          awk -F '"' \
            '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' \
            rust-toolchain.toml
        )"
        if [[ -z "${toolchain}" ]]; then
          echo "::error file=rust-toolchain.toml::missing toolchain channel"
          exit 1
        fi

        install_args=(
          toolchain install "${toolchain}"
          --profile minimal
          --no-self-update
        )
        if [[ -n "${COMPONENTS}" ]]; then
          IFS=',' read -r -a components <<< "${COMPONENTS}"
          for component in "${components[@]}"; do
            install_args+=(--component "${component}")
          done
        fi
        if [[ -n "${TARGETS}" ]]; then
          IFS=',' read -r -a targets <<< "${TARGETS}"
          for target in "${targets[@]}"; do
            install_args+=(--target "${target}")
          done
        fi

        rustup "${install_args[@]}"
        rustup override set "${toolchain}"
        rustc -Vv
        cargo -V
