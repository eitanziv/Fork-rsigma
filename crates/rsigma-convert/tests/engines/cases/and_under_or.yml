description: An AND of selections nested under OR keeps its grouping, including in LynxDB, where OR binds tighter than AND.
rule:
  title: and under or
  logsource: {category: process_creation, product: windows}
  detection:
    sel_image:
      Image|endswith: 'cmd.exe'
    sel_cmd:
      CommandLine|contains: 'whoami'
    parent:
      ParentImage|endswith: 'explorer.exe'
    condition: (sel_image and sel_cmd) or parent
events:
  - {Image: 'C:\cmd.exe', CommandLine: 'whoami', ParentImage: 'C:\services.exe'}
  - {Image: 'C:\cmd.exe', CommandLine: 'dir', ParentImage: 'C:\explorer.exe'}
  - {Image: 'C:\pwsh.exe', CommandLine: 'dir', ParentImage: 'C:\explorer.exe'}
  - {Image: 'C:\pwsh.exe', CommandLine: 'whoami', ParentImage: 'C:\services.exe'}
  - {Image: 'C:\cmd.exe', CommandLine: 'dir', ParentImage: 'C:\services.exe'}
matches: [0, 1, 2]
