description: An empty string value matches only an empty field, not a missing one.
rule:
  title: empty string
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine: ''
    condition: selection
events:
  - {CommandLine: ''}
  - {CommandLine: 'x'}
  - {Image: 'C:\x.exe'}
matches: [0]
known_failures:
  fibratus:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so an absent field equals ''"
    actual: [0, 2]
  fibratus-nomacros:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so an absent field equals ''"
    actual: [0, 2]
