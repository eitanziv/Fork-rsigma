description: neq negates the whole item, so it matches when the field is missing or null.
rule:
  title: neq missing field
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      User|neq: admin
    condition: selection
events:
  - {User: 'admin'}
  - {User: 'bob'}
  - {User: null}
  - {Image: 'x'}
  - {User: 'ADMIN'}
matches: [1, 2, 3]
