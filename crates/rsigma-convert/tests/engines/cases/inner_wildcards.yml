description: Unescaped stars in a plain value are unbounded wildcards.
rule:
  title: inner wildcards
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine: '*foo*bar*'
    condition: selection
events:
  - {CommandLine: 'xfooYbarz'}
  - {CommandLine: 'FOOBAR'}
  - {CommandLine: 'barfoo'}
  - {CommandLine: 'fooba'}
matches: [0, 1]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "match values are not quoted"
    actual: ["CommandLine match *foo*bar*"]
    reference: ["CommandLine match \"*foo*bar*\""]
