description: A single-item filter excluded with and not.
rule:
  title: and not filter
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|endswith: '\cmd.exe'
    filter:
      ParentImage|endswith: '\explorer.exe'
    condition: selection and not filter
events:
  - {Image: 'C:\cmd.exe', ParentImage: 'C:\explorer.exe'}
  - {Image: 'C:\cmd.exe', ParentImage: 'C:\services.exe'}
  - {Image: 'C:\pwsh.exe', ParentImage: 'C:\services.exe'}
  - {Image: 'C:\cmd.exe', ParentImage: 'C:\EXPLORER.EXE'}
matches: [1]
