description: A backslash not followed by a wildcard or another backslash is literal.
rule:
  title: backslash literal
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|contains: 'C:\Temp\x'
    condition: selection
events:
  - {CommandLine: 'copy C:\Temp\x.dll'}
  - {CommandLine: 'copy C:Tempx.dll'}
  - {CommandLine: 'copy C:/Temp/x.dll'}
  - {CommandLine: 'copy C:\\Temp\\x.dll'}
matches: [0]
