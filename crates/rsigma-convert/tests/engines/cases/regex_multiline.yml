description: re|m makes ^ and $ match at line breaks.
rule:
  title: regex multiline
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|re|m: '^whoami$'
    condition: selection
events:
  - {CommandLine: "cmd\nwhoami\nexit"}
  - {CommandLine: 'cmd whoami'}
  - {CommandLine: 'whoami'}
matches: [0, 2]
known_failures:
  lynxdb:
    type: match-mismatch
    reason: "the =~ operator matches nothing once events are flushed to segments, while match() does"
    actual: []
