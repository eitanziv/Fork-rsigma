description: A value list ANDed with another field keeps the OR grouped.
rule:
  title: or under and
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|endswith:
        - '\a.exe'
        - '\b.exe'
      CommandLine|contains: 'x'
    condition: selection
events:
  - {Image: 'C:\a.exe', CommandLine: 'zxz'}
  - {Image: 'C:\b.exe', CommandLine: 'zxz'}
  - {Image: 'C:\a.exe', CommandLine: 'zzz'}
  - {Image: 'C:\c.exe', CommandLine: 'zxz'}
matches: [0, 1]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "backslashes in values are doubled; values of one field are not rendered as an in-list"
    actual: ["(Image endswith \"\\\\a.exe\" or Image endswith \"\\\\b.exe\") and CommandLine contains \"x\""]
    reference: ["(Image in (\"*\\a.exe\", \"*\\b.exe\")) and CommandLine contains \"x\""]
