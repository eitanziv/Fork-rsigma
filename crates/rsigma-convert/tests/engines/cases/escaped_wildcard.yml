description: An escaped star is a literal star, not a wildcard.
rule:
  title: escaped wildcard
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|contains: 'a\*b'
    condition: selection
events:
  - {CommandLine: 'x a*b y'}
  - {CommandLine: 'x aZZb y'}
  - {CommandLine: 'x ab y'}
matches: [0]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "the escape of a literal * is dropped"
    actual: ["CommandLine contains \"a*b\""]
    reference: ["CommandLine contains \"a\\*b\""]
