description: An escaped star is a literal star, not a wildcard.
rule:
  title: escaped wildcard
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|contains: 'a\*b'
    condition: selection
events:
  - {CommandLine: 'x a*b y'}
  - {CommandLine: 'x aZZb y'}
  - {CommandLine: 'x ab y'}
matches: [0]
known_failures:
  lynxdb: the literal star is emitted inside quotes, where LynxDB still treats it as a wildcard
  test-pysigma: the escape of a literal * is dropped
  fibratus: a literal * renders as \* in the string, which the Fibratus parser rejects as a bad escape
  fibratus-nomacros: a literal * renders as \* in the string, which the Fibratus parser rejects as a bad escape
