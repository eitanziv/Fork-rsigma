description: re|i matches case-insensitively.
rule:
  title: regex i flag
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|re|i: 'who.mi'
    condition: selection
events:
  - {CommandLine: 'x whoami'}
  - {CommandLine: 'x WHOAMI'}
  - {CommandLine: 'x who'}
matches: [0, 1]
known_failures:
  lynxdb: the i flag is dropped from the regex
  test-pysigma: the i flag is dropped instead of rendered as (?i)
