description: re|i matches case-insensitively.
rule:
  title: regex i flag
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|re|i: 'who.mi'
    condition: selection
events:
  - {CommandLine: 'x whoami'}
  - {CommandLine: 'x WHOAMI'}
  - {CommandLine: 'x who'}
matches: [0, 1]
known_failures:
  lynxdb:
    type: match-mismatch
    reason: "the =~ operator matches nothing once events are flushed to segments, while match() does"
    actual: []
