description: Wildcards match across newlines.
rule:
  title: multiline wildcard
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine: 'a*c'
    condition: selection
events:
  - {CommandLine: "a\nc"}
  - {CommandLine: "abc"}
  - {CommandLine: "ab"}
matches: [0, 1]
