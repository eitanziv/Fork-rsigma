description: Wildcards match across newlines.
rule:
  title: multiline wildcard
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine: 'a*c'
    condition: selection
events:
  - {CommandLine: "a\nc"}
  - {CommandLine: "abc"}
  - {CommandLine: "ab"}
matches: [0, 1]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "match values are not quoted"
    actual: ["CommandLine match a*c"]
    reference: ["CommandLine match \"a*c\""]
