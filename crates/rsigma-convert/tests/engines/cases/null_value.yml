description: A null value matches a missing or null field.
rule:
  title: null value
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|endswith: '\cmd.exe'
      User: null
    condition: selection
events:
  - {Image: 'C:\cmd.exe'}
  - {Image: 'C:\cmd.exe', User: null}
  - {Image: 'C:\cmd.exe', User: 'admin'}
  - {Image: 'C:\cmd.exe', User: ''}
matches: [0, 1]
known_failures:
  fibratus:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so the null test also matches a present empty value"
    actual: [0, 1, 3]
  fibratus-nomacros:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so the null test also matches a present empty value"
    actual: [0, 1, 3]
