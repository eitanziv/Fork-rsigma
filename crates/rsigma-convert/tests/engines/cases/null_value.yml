description: A null value matches a missing or null field.
rule:
  title: null value
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|endswith: '\cmd.exe'
      User: null
    condition: selection
events:
  - {Image: 'C:\cmd.exe'}
  - {Image: 'C:\cmd.exe', User: null}
  - {Image: 'C:\cmd.exe', User: 'admin'}
  - {Image: 'C:\cmd.exe', User: ''}
matches: [0, 1]
known_failures:
  lynxdb: NOT field=* does not match a field that is present with a null value
  test-pysigma: backslashes in values are doubled
  fibratus: null renders as = '', which matches an empty string instead of an absent field
  fibratus-nomacros: null renders as = '', which matches an empty string instead of an absent field
