description: A null value matches a missing or null field.
rule:
  title: null value
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|endswith: '\cmd.exe'
      User: null
    condition: selection
events:
  - {Image: 'C:\cmd.exe'}
  - {Image: 'C:\cmd.exe', User: null}
  - {Image: 'C:\cmd.exe', User: 'admin'}
  - {Image: 'C:\cmd.exe', User: ''}
matches: [0, 1]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "backslashes in values are doubled"
    actual: ["Image endswith \"\\\\cmd.exe\" and User is null"]
    reference: ["Image endswith \"\\cmd.exe\" and User is null"]
