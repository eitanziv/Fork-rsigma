description: A question mark is a wildcard for exactly one character.
rule:
  title: question wildcard
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine: 'ab?d'
    condition: selection
events:
  - {CommandLine: 'abcd'}
  - {CommandLine: 'ABXD'}
  - {CommandLine: 'abd'}
  - {CommandLine: 'abccd'}
  - {CommandLine: 'ab?d'}
matches: [0, 1, 4]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "match values are not quoted"
    actual: ["CommandLine match ab?d"]
    reference: ["CommandLine match \"ab?d\""]
