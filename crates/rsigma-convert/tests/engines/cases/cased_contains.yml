description: cased makes the comparison case-sensitive.
rule:
  title: cased contains
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|cased|contains: 'Whoami'
    condition: selection
events:
  - {CommandLine: 'x Whoami y'}
  - {CommandLine: 'x whoami y'}
  - {CommandLine: 'x WHOAMI y'}
matches: [0]
