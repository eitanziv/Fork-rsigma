description: re is case-sensitive by default.
rule:
  title: regex case sensitive
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|re: 'who.mi'
    condition: selection
events:
  - {CommandLine: 'x whoami'}
  - {CommandLine: 'x WHOAMI'}
matches: [0]
known_failures:
  postgres-jsonb:
    type: match-mismatch
    reason: "re renders as the case-insensitive ~* operator"
    actual: [0, 1]
  postgres-columns:
    type: match-mismatch
    reason: "re renders as the case-insensitive ~* operator"
    actual: [0, 1]
  lynxdb:
    type: match-mismatch
    reason: "the =~ operator matches nothing once events are flushed to segments, while match() does"
    actual: []
