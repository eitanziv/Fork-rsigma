description: An empty value list is a null check, so it matches a missing or null field.
rule:
  title: empty value list
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      User: []
    condition: selection
events:
  - {User: null}
  - {Image: 'x'}
  - {User: ''}
  - {User: 'bob'}
matches: [0, 1]
known_failures:
  fibratus:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so the null test also matches a present empty value"
    actual: [0, 1, 2]
  fibratus-nomacros:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so the null test also matches a present empty value"
    actual: [0, 1, 2]
