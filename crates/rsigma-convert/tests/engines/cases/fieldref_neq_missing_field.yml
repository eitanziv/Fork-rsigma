description: fieldref with neq negates the whole item, so it matches when either field is missing.
rule:
  title: fieldref neq missing field
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|fieldref|neq: ParentImage
    condition: selection
unsupported: [lynxdb]
events:
  - {Image: 'a.exe', ParentImage: 'a.exe'}
  - {Image: 'a.exe', ParentImage: 'b.exe'}
  - {Image: 'a.exe'}
  - {ParentImage: 'a.exe'}
  - {CommandLine: 'x'}
matches: [1, 2, 3, 4]
known_failures:
  fibratus:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so two absent fields compare equal"
    actual: [1, 2, 3]
  fibratus-nomacros:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so two absent fields compare equal"
    actual: [1, 2, 3]
