description: fieldref with neq negates the whole item, so it matches when either field is missing.
rule:
  title: fieldref neq missing field
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|fieldref|neq: ParentImage
    condition: selection
unsupported: [lynxdb]
events:
  - {Image: 'a.exe', ParentImage: 'a.exe'}
  - {Image: 'a.exe', ParentImage: 'b.exe'}
  - {Image: 'a.exe'}
  - {ParentImage: 'a.exe'}
  - {CommandLine: 'x'}
matches: [1, 2, 3, 4]
known_failures:
  fibratus:
    type: engine-error
    reason: "the pipeline maps the compared field name but leaves the fieldref value unmapped"
    contains: "ps.exe ~= ParentImage"
  fibratus-nomacros:
    type: engine-error
    reason: "the pipeline maps the compared field name but leaves the fieldref value unmapped"
    contains: "ps.exe ~= ParentImage"
