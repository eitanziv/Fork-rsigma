description: A pipeline add_condition with a value list is ANDed onto an OR condition with both sides grouped.
rule:
  title: add condition
  logsource: {category: process_creation, product: windows}
  detection:
    sel_image:
      Image|endswith: 'cmd.exe'
    sel_cmd:
      CommandLine|contains: 'whoami'
    condition: 1 of sel_*
pipeline:
  name: add user condition
  priority: 10
  transformations:
    - id: user_filter
      type: add_condition
      conditions:
        User:
          - alice
          - bob
events:
  - {Image: 'C:\cmd.exe', CommandLine: 'dir', User: 'carol'}
  - {Image: 'C:\pwsh.exe', CommandLine: 'whoami', User: 'bob'}
  - {Image: 'C:\pwsh.exe', CommandLine: 'dir', User: 'bob'}
  - {Image: 'C:\cmd.exe', CommandLine: 'dir', User: 'alice'}
matches: [1, 3]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "the added condition is appended instead of prepended; selector operands are ordered by name instead of definition"
    actual: ["(CommandLine contains \"whoami\" or Image endswith \"cmd.exe\") and (User in (\"alice\", \"bob\"))"]
    reference: ["(User in (\"alice\", \"bob\")) and (Image endswith \"cmd.exe\" or CommandLine contains \"whoami\")"]
