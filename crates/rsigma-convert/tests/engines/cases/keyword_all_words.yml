description: A field-less |all list matches when every value occurs in the event, in one value or across several. The values are whole words so token-based full-text engines can match them.
rule:
  title: keyword all words
  logsource: {category: process_creation, product: windows}
  detection:
    keywords:
      '|all':
        - 'mimikatz'
        - 'sekurlsa'
    condition: keywords
events:
  - {CommandLine: 'MIMIKATZ sekurlsa logonpasswords'}
  - {Image: 'mimikatz', CommandLine: 'run sekurlsa pth'}
  - {CommandLine: 'mimikatz privilege debug'}
  - {CommandLine: 'sekurlsa logonpasswords'}
matches: [0, 1]
unsupported: [fibratus, fibratus-nomacros]
