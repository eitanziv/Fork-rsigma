description: exists false matches events that lack the field, but not a field whose value is null.
rule:
  title: exists false
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      User|exists: false
    condition: selection
events:
  - {User: 'admin'}
  - {Image: 'C:\x.exe'}
  - {User: null}
matches: [1]
known_failures:
  postgres-columns:
    type: match-mismatch
    reason: "a typed column stores an absent field and a null value as the same SQL NULL"
    actual: [1, 2]
  fibratus:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so a null value counts as absent"
    actual: [1, 2]
  fibratus-nomacros:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so a null value counts as absent"
    actual: [1, 2]
