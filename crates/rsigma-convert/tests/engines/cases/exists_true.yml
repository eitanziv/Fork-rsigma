description: exists true matches events that have the field, even when its value is null.
rule:
  title: exists true
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      User|exists: true
    condition: selection
events:
  - {User: 'admin'}
  - {Image: 'C:\x.exe'}
  - {User: ''}
  - {User: null}
matches: [0, 2, 3]
known_failures:
  postgres-columns:
    type: match-mismatch
    reason: "a typed column stores an absent field and a null value as the same SQL NULL"
    actual: [0, 2]
  fibratus:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so presence fails for an empty or null value"
    actual: [0]
  fibratus-nomacros:
    type: match-mismatch
    reason: "Fibratus reads a field the event lacks, or holds as null, as an empty string, so presence fails for an empty or null value"
    actual: [0]
