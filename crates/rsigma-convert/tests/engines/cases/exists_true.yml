description: exists true matches events that have the field, even when its value is null.
rule:
  title: exists true
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      User|exists: true
    condition: selection
events:
  - {User: 'admin'}
  - {Image: 'C:\x.exe'}
  - {User: ''}
  - {User: null}
matches: [0, 2, 3]
known_failures:
  postgres-jsonb:
    type: match-mismatch
    reason: "exists renders as IS NOT NULL on the extracted value, which treats a JSON null as absent"
    actual: [0, 2]
  postgres-columns:
    type: match-mismatch
    reason: "a typed column stores an absent field and a null value as the same SQL NULL"
    actual: [0, 2]
  fibratus:
    type: match-mismatch
    reason: "exists renders as a comparison with false, which never matches a string field"
    actual: []
  fibratus-nomacros:
    type: match-mismatch
    reason: "exists renders as a comparison with false, which never matches a string field"
    actual: []
