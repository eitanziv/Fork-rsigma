description: Two single-item selections joined with or.
rule:
  title: or selections
  logsource: {category: process_creation, product: windows}
  detection:
    sel_a:
      Image|endswith: '\cmd.exe'
    sel_b:
      CommandLine|contains: 'whoami'
    condition: sel_a or sel_b
events:
  - {Image: 'C:\cmd.exe', CommandLine: 'dir'}
  - {Image: 'C:\pwsh.exe', CommandLine: 'whoami'}
  - {Image: 'C:\pwsh.exe', CommandLine: 'dir'}
  - {User: 'x'}
matches: [0, 1]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "backslashes in values are doubled"
    actual: ["Image endswith \"\\\\cmd.exe\" or CommandLine contains \"whoami\""]
    reference: ["Image endswith \"\\cmd.exe\" or CommandLine contains \"whoami\""]
