description: Negating a detection on a field the event lacks is true, because the detection itself is false.
rule:
  title: not missing field
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|endswith: '\cmd.exe'
    filter:
      ParentImage|endswith: '\explorer.exe'
    condition: selection and not filter
events:
  - {Image: 'C:\cmd.exe'}
  - {Image: 'C:\cmd.exe', ParentImage: 'C:\explorer.exe'}
matches: [0]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "backslashes in values are doubled"
    actual: ["Image endswith \"\\\\cmd.exe\" and not ParentImage endswith \"\\\\explorer.exe\""]
    reference: ["Image endswith \"\\cmd.exe\" and not ParentImage endswith \"\\explorer.exe\""]
  fibratus:
    type: match-mismatch
    reason: "NOT over a field the event lacks evaluates to false, so the event is dropped"
    actual: []
  fibratus-nomacros:
    type: match-mismatch
    reason: "NOT over a field the event lacks evaluates to false, so the event is dropped"
    actual: []
