description: base64offset matches the value base64-encoded at each of the three byte offsets inside a longer encoded string.
rule:
  title: base64offset
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      CommandLine|base64offset|contains: 'IEX'
    condition: selection
events:
  - {CommandLine: 'powershell -enc SUVYIChOZXctT2JqZWN0IE5ldC5XZWJDbGllbnQp'}
  - {CommandLine: 'powershell -enc eElFWCAoTmV3LU9iamVjdCBOZXQuV2ViQ2xpZW50KQ=='}
  - {CommandLine: 'powershell -enc eHhJRVggKE5ldy1PYmplY3QgTmV0LldlYkNsaWVudCk='}
  - {CommandLine: 'powershell -enc R2V0LVByb2Nlc3M='}
  - {CommandLine: 'IEX (New-Object Net.WebClient)'}
matches: [0, 1, 2]
