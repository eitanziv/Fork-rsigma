title: Not Nested Or
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd.exe'
    filter_cmd:
        CommandLine|contains:
            - 'shell32'
            - 'rundll32'
    filter_parent:
        ParentImage|endswith: '\explorer.exe'
        User: 'admin'
    condition: selection and not (filter_cmd or filter_parent)
